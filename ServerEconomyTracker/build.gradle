plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "3.0.2"
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'dev.zyverasystems'
version = '1.0.2'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        url = 'https://jitpack.io'
    }
    maven {
        url = 'https://repo.essentialsx.net/releases/'
    }
    maven {
        name = "faststatsReleases"
        url = uri("https://repo.faststats.dev/releases")
    }
}

dependencies {
    // Compile against the oldest supported version (1.21.11) so the plugin also runs on 26.x
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    // Exclude the old Bukkit/Spigot APIs these pull in, paper-api already provides them
    compileOnly("com.github.MilkBowl:VaultAPI:1.7") {
        exclude group: 'org.bukkit'
    }
    compileOnly("com.github.YiC200333:XConomyAPI:2.25.1") {
        exclude group: 'org.bukkit'
        exclude group: 'org.spigotmc'
    }
    compileOnly("net.essentialsx:EssentialsX:2.21.0") {
        exclude group: 'org.bukkit'
        exclude group: 'org.spigotmc'
    }

    implementation("dev.faststats.metrics:bukkit:0.27.1")
    implementation 'com.zaxxer:HikariCP:6.3.0'
    implementation 'com.mysql:mysql-connector-j:9.6.0'
    implementation 'org.xerial:sqlite-jdbc:3.51.2.0'
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.21.11")
    }
}

// Minecraft 1.21.11 runs on Java 21, 26.x on Java 25.
// Java 21 bytecode runs on both, so we target 21.
def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks {
    build {
        dependsOn shadowJar
    }
    shadowJar {
        relocate 'dev.faststats', 'dev.zyverasystems.libs.faststats'
    }
}
